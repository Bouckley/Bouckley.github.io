<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1218" media="(prefers-color-scheme: dark)" />

    <title>Jordan Santos-Bouckley | Data &amp; Software Engineering</title>
    <meta
      name="description"
      content="Computer Science student at Queen's University building analytics, BI dashboards, and decision-automation tools on large real-world datasets."
    />
    <meta name="author" content="Jordan Santos-Bouckley" />

    <meta property="og:title" content="Jordan Santos-Bouckley | Data &amp; Software Engineering" />
    <meta
      property="og:description"
      content="Computer Science student at Queen's University building analytics, BI dashboards, and decision-automation tools on large real-world datasets."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Resolve the theme before first paint. Without this the page renders light
      then snaps to dark once React mounts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode or blocked storage — fall through to the light default */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
